name: Update and publish website

on:
  schedule:
    - cron: '30 20 * * *'   # 20:30 UTC = 7:30 am Melbourne (AEDT), every day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Put the data files in the data folder
        run: |
          mkdir -p data
          for f in assemble.py cands.txt cands_parsed.json districts.geojson localities.json locs.py main.txt model.py news_access.json pend.json photos.json photos.py polls.txt post.py r22.txt r22_parsed.json r22parse.py timeseries.py vec_parsed.json; do
            if [ -f "$f" ]; then mv "$f" data/; fi
          done
      - name: Refresh polls, run the model, build the site
        run: python3 update.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
